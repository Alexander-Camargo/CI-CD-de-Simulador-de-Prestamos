name: "Pipeline 2: Construcción y Docker"

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'Dockerfile'
  workflow_dispatch:

env:
  ACR_NAME: "acrprestamos2026"
  IMAGE_NAME: "simulador-app"

jobs:
  build-and-push:
    name: "Build & Push a ACR"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Autenticación en Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Autenticación en ACR
      run: |
        az acr login --name ${{ env.ACR_NAME }}

    - name: Construir y Subir Imagen Docker
      run: |
        ACR_SERVER="${{ env.ACR_NAME }}.azurecr.io"
        
        echo "Construyendo imagen..."
        # Etiquetamos la imagen tanto con el commit exacto como con 'latest'
        docker build \
          -t $ACR_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -t $ACR_SERVER/${{ env.IMAGE_NAME }}:latest \
          .
        
        echo "Subiendo imágenes al registro..."
        docker push $ACR_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push $ACR_SERVER/${{ env.IMAGE_NAME }}:latest
```