name: Pipeline 3 - Despliegue a ACI

on:
  workflow_dispatch:

env:
  RESOURCE_GROUP: "rg-prestamos"
  ACR_NAME: "acrprestamos2026"
  APP_PORT: 8080
  CONTAINER_NAME: "simulador-app"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Azure con credenciales
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Obtener información del ACR
        run: |
          ACR_LOGIN_SERVER=$(az acr show \
            --name ${{ env.ACR_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query loginServer \
            --output tsv)
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV
          echo "ACR encontrado: $ACR_LOGIN_SERVER"

      - name: Obtener el nombre del ACI
        run: |
          ACI_NAME=$(az container list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?contains(name, 'prestamos-aci')].name" \
            --output tsv)
          if [ -z "$ACI_NAME" ]; then
            echo "No se encontró el ACI"
            exit 1
          fi
          echo "ACI_NAME=$ACI_NAME" >> $GITHUB_ENV
          echo "ACI encontrado: $ACI_NAME"

      - name: Obtener la última imagen del ACR
        run: |
          IMAGE_TAG=$(az acr repository show-tags \
            --name ${{ env.ACR_NAME }} \
            --repository ${{ env.CONTAINER_NAME }} \
            --orderby time_desc \
            --top 1 \
            --output tsv 2>/dev/null || echo "latest")
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Imagen: ${{ env.ACR_NAME }}.azurecr.io/${{ env.CONTAINER_NAME }}:$IMAGE_TAG"

      - name: Actualizar contenedor en ACI
        run: |
          echo "Actualizando contenedor..."
          az container restart \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.ACI_NAME }} \
            --container-name ${{ env.CONTAINER_NAME }}

      - name: Esperar a que el contenedor esté listo
        run: |
          echo "⏳ Esperando que el contenedor esté en ejecución..."
          MAX_ATTEMPTS=30
          ATTEMPT=0
          STATE="Unknown"
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATE=$(az container show \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.ACI_NAME }} \
              --query "containers[?name=='${{ env.CONTAINER_NAME }}'].instanceView.currentState.state" \
              --output tsv 2>/dev/null || echo "Unknown")
            if [ "$STATE" = "Running" ]; then
              echo "Contenedor en ejecución"
              break
            fi
            sleep 10
            ATTEMPT=$((ATTEMPT+1))
          done
          if [ "$STATE" != "Running" ]; then
            echo "El contenedor no está en ejecución"
            exit 1
          fi

      - name: Obtener IP del contenedor
        run: |
          IP_ADDRESS=$(az container show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.ACI_NAME }} \
            --query "ipAddress.ip" \
            --output tsv 2>/dev/null || echo "No disponible")
          echo "CONTAINER_IP=$IP_ADDRESS" >> $GITHUB_ENV
          echo "IP: $IP_ADDRESS"

      - name: Validar aplicación
        run: |
          APP_URL="http://${{ env.CONTAINER_IP }}:${{ env.APP_PORT }}"
          echo "🧪 Probando: $APP_URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 15 \
            $APP_URL/health 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
            echo "Aplicación responde (HTTP $HTTP_CODE)"
          else
            echo "No responde (HTTP $HTTP_CODE)"
            az container logs \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.ACI_NAME }} \
              --container-name ${{ env.CONTAINER_NAME }}
          fi

      - name: Mostrar resumen
        run: |
          echo "========================================="
          echo "DESPLIEGUE COMPLETADO"
          echo "========================================="
          echo "Imagen: ${{ env.ACR_NAME }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ env.IMAGE_TAG }}"
          echo "URL: http://${{ env.CONTAINER_IP }}:${{ env.APP_PORT }}"
          echo "Contenedor: ${{ env.ACI_NAME }}"
          echo "========================================="


          